name: macOS Fling (private)
# Builds the macOS app and keeps it as a workflow artifact. It never touches a release:
# release files are signed on the maintainer's machine (windows/release.ps1, SECURITY.md),
# and a CI upload would replace them with unsigned rebuilds.
on:
  workflow_dispatch:
  push:
    paths:
      - "macos/**"
      - ".github/workflows/macos-fling.yml"
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Prefer standard GitHub-hosted macOS; some orgs reject xl labels
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Fling.app
        run: ./macos/build.sh
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Fling-macOS-private
          path: |
            macos/dist/Fling.app.zip
            macos/dist/Fling
            macos/dist/Info.plist
          if-no-files-found: error

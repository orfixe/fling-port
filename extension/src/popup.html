<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="popup.css">
  <title>Fling</title>
</head>
<body>
  <!-- the desktop app isn't running / not installed -->
  <section id="offline" hidden>
    <img src="icons/fling-64.png" width="44" height="44" alt="">
    <h1 data-i18n="offlineTitle"></h1>
    <p class="muted" data-i18n="offlineBody"></p>
    <a class="link" id="guide" target="_blank" rel="noopener" data-i18n="offlineGuide"
       href="https://github.com/orfixe/fling-port/blob/main/docs/install-windows.md"></a>
    <button class="btn" id="retry" data-i18n="retry"></button>
  </section>

  <main id="main" hidden>
    <!-- now playing -->
    <section id="now" hidden>
      <div class="art"><img id="art" alt=""></div>
      <div class="title" id="nowTitle"></div>
      <div class="muted small" id="nowSub"></div>
      <div class="progress" id="progress" data-i18n-title="seekHint"><div class="track"><div id="bar"></div></div></div>
      <div class="times"><span id="el"></span><span id="rem"></span></div>
      <div class="transport">
        <button class="key" data-act="prev" id="prev" data-i18n-title="prevVideo" hidden>
          <svg viewBox="0 0 24 24"><path d="M6 6v12"/><path class="fill" d="M18 6v12l-9-6z"/></svg></button>
        <button class="key" data-act="seek" data-sec="-30" data-i18n-title="back30">
          <svg viewBox="0 0 24 24"><path d="M11 6 5 12l6 6M19 6l-6 6 6 6"/></svg></button>
        <button class="key big accent" id="playPause" data-act="play_pause" data-i18n-title="playPause">
          <svg viewBox="0 0 24 24" id="icoPause"><path d="M9 6v12M15 6v12"/></svg>
          <svg viewBox="0 0 24 24" id="icoPlay" hidden><path class="fill" d="M8 5v14l11-7z"/></svg></button>
        <button class="key" data-act="seek" data-sec="30" data-i18n-title="fwd30">
          <svg viewBox="0 0 24 24"><path d="m13 6 6 6-6 6M5 6l6 6-6 6"/></svg></button>
        <button class="key" data-act="next" id="next" data-i18n-title="nextVideo" hidden>
          <svg viewBox="0 0 24 24"><path d="M18 6v12"/><path class="fill" d="M6 6v12l9-6z"/></svg></button>
        <button class="key" data-act="stop" data-i18n-title="stop">
          <svg viewBox="0 0 24 24"><rect class="fill" x="7" y="7" width="10" height="10" rx="1.5"/></svg></button>
      </div>
    </section>

    <!-- this tab -->
    <section id="tabBox">
      <div class="title" id="tabTitle"></div>
      <div class="muted small" id="tabHost"></div>
      <button class="row accent" id="castTab">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path class="fill" d="m10 8.5 5 3-5 3z"/></svg>
        <span id="castLabel" data-i18n="castTab"></span>
        <kbd id="castKey">Alt+Shift+C</kbd>
      </button>
      <button class="row sub" id="castStart" hidden>
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>
        <span data-i18n="castFromStart"></span>
      </button>
      <div class="warn small" id="castWhy" hidden></div>
    </section>

    <!-- recent casts from this browser -->
    <details id="recentBox" hidden>
      <summary>
        <svg viewBox="0 0 24 24" class="chev"><path d="m9 6 6 6-6 6"/></svg>
        <span data-i18n="recent"></span>
        <button class="linkbtn" id="clearRecent" data-i18n="clear"></button>
      </summary>
      <div id="recentList"></div>
    </details>

    <div class="vol">
      <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/></svg>
      <input type="range" id="volume" min="0" max="100" step="1">
      <span class="muted small" id="volVal"></span>
    </div>

    <hr>

    <!-- TV remote -->
    <section id="remoteSetup" hidden>
      <p class="muted small" data-i18n="pairHint"></p>
      <button class="row" data-act="wake">
        <svg viewBox="0 0 24 24"><path d="M7.5 6.5a7 7 0 1 0 9 0M12 3v8"/></svg>
        <span data-i18n="turnOn"></span></button>
      <button class="row accent" data-act="pair_remote">
        <svg viewBox="0 0 24 24" class="green"><rect x="2" y="4" width="16" height="12" rx="2"/><path d="M6 20h7M20 13v9M16 17.5h8"/></svg>
        <span data-i18n="setUpRemote"></span></button>
    </section>

    <section id="remote" hidden>
      <div class="rhead">
        <div>
          <div class="caps muted" data-i18n="onTheTv"></div>
          <div class="title" id="tvNow"></div>
        </div>
        <button class="key" data-key="power" data-i18n-title="power">
          <svg viewBox="0 0 24 24"><path d="M7.5 6.5a7 7 0 1 0 9 0M12 3v8"/></svg></button>
      </div>
      <div class="apps" id="apps"></div>
      <div class="dpad">
        <button class="key" data-key="up"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
        <div class="mid">
          <button class="key" data-key="back" data-i18n-title="back"><svg viewBox="0 0 24 24"><path d="M9 7 5 11l4 4"/><path d="M5 11h9a5 5 0 0 1 0 10h-3"/></svg></button>
          <button class="key" data-key="left"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
          <button class="key ok accent" data-key="ok">OK</button>
          <button class="key" data-key="right"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
          <button class="key" data-key="home" data-i18n-title="home"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7M6 10v10h12V10"/></svg></button>
        </div>
        <button class="key" data-key="down"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="muted tiny" data-i18n="scrollHint"></div>
      </div>
      <div class="pills">
        <button class="pill" data-key="vol_down" data-i18n="volDown"></button>
        <button class="pill" data-key="mute" data-i18n="mute"></button>
        <button class="pill" data-key="vol_up" data-i18n="volUp"></button>
      </div>
      <form id="typeForm"><input id="typeText" autocomplete="off" data-i18n-placeholder="typeOnTv"></form>
    </section>

    <div class="warn small" id="error" hidden></div>

    <hr>
    <button class="row" data-act="open_panel">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <span data-i18n="openPanel"></span></button>
    <footer>
      <span class="dot" id="dot"></span>
      <select id="device"></select>
      <button class="linkbtn" id="opts" data-i18n="settings"></button>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>

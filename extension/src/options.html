<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Fling</title>
  <style>
    body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 560px; margin: 24px auto; padding: 0 18px; }
    h1 { font-size: 18px; display: flex; align-items: center; gap: 10px; }
    label { display: flex; gap: 10px; align-items: flex-start; margin: 14px 0; }
    .hint { opacity: .6; font-size: 12.5px; display: block; }
    input[type=number] { width: 90px; font: inherit; }
    #state { margin-top: 18px; font-size: 13px; }
    .ok { color: #28c840; } .bad { color: #e08600; }
    a { color: #0a84ff; }
  </style>
</head>
<body>
  <h1><img src="icons/fling-48.png" width="32" height="32" alt=""> <span data-i18n="optionsTitle"></span></h1>
  <label><input type="checkbox" id="shareTabs">
    <span><span data-i18n="optShareTabs"></span><span class="hint" data-i18n="optShareTabsHint"></span></span></label>
  <label><input type="checkbox" id="pauseAfterCast">
    <span><span data-i18n="optPause"></span><span class="hint" data-i18n="optPauseHint"></span></span></label>
  <label><input type="checkbox" id="notifyTrack" disabled>
    <span><span data-i18n="optNotify"></span><span class="hint" data-i18n="optNotifyHint"></span></span></label>
  <label><span><span data-i18n="optPort"></span><span class="hint" data-i18n="optPortHint"></span></span>
    <input type="number" id="port" min="1024" max="65535"></label>
  <div id="state"></div>
  <p class="hint"><span data-i18n="optShortcut"></span></p>
  <p class="hint"><a href="https://github.com/orfixe/fling-linux-android" target="_blank" rel="noopener">github.com/orfixe/fling-linux-android</a> ·
    <span data-i18n="credit"></span></p>
  <script src="options.js"></script>
</body>
</html>
